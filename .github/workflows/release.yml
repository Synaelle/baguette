name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            Baguette.exe
            baguette-cli.exe
            add-to-path.bat
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev patchelf file
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/linux"
      - run: cargo install tauri-cli --version "^2" --locked
      - name: build
        run: ./build.sh
      - name: pack
        run: |
          mkdir Baguette
          cp Baguette-x86_64.AppImage baguette-cli Baguette/
          tar --owner=0 --group=0 --mode=755 -czf linux.tar.gz Baguette
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: linux.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          if [ "v$version" != "$TAG" ]; then
            echo "the tag $TAG doesn't match VERSION $version" >&2
            exit 1
          fi
          mkdir Baguette
          cp windows/* Baguette/
          python3 -m zipfile -c "Baguette-$version-windows.zip" Baguette
          mv linux/linux.tar.gz "Baguette-$version-linux.tar.gz"
          gh release create "$TAG" --draft --title "$version" --notes "" \
            "Baguette-$version-windows.zip" "Baguette-$version-linux.tar.gz"
