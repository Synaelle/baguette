name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          if [ "v$version" != "$TAG" ]; then
            echo "the tag $TAG doesn't match VERSION $version" >&2
            exit 1
          fi
          # a draft written earlier keeps its notes
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$version" --notes ""
          fi

  # the engine test runs against Cement's PC test server, built from the cement repo
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Synaelle/cement
          path: cement
          persist-credentials: false
      - name: install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - run: rustup toolchain install stable --profile minimal -c clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build cement-server
        # outside this workspace, or cargo takes it for a member
        run: |
          mv cement "$RUNNER_TEMP/cement"
          cd "$RUNNER_TEMP/cement"
          cargo build --release --locked
      - run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: CEMENT_SERVER="$RUNNER_TEMP/cement/target/release/cement-server" cargo test --workspace --locked

  windows:
    needs: [draft, test]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        shell: cmd
        run: build.bat
      - name: attach to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir Baguette
          cp Baguette.exe baguette-cli.exe add-to-path.bat Baguette/
          7z a -tzip "Baguette-$version-windows.zip" Baguette
          gh release upload "$TAG" "Baguette-$version-windows.zip" --clobber

  linux:
    needs: [draft, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev patchelf file
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target/linux"
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: build
        run: ./build.sh
      - name: attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir Baguette
          cp Baguette-x86_64.AppImage baguette-cli Baguette/
          tar --owner=0 --group=0 --mode=755 -czf "Baguette-$version-linux.tar.gz" Baguette
          gh release upload "$TAG" "Baguette-$version-linux.tar.gz" --clobber

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sign the archives' checksums
        # SHA256SUMS and its Ed25519 signature: the updater checks both before unpacking
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "the RELEASE_SIGNING_KEY secret is missing" >&2; exit 1; }
          version=$(tr -d '\r\n' < VERSION)
          files=("Baguette-$version-windows.zip" "Baguette-$version-linux.tar.gz")
          dir="$RUNNER_TEMP/sums"
          mkdir -p "$dir"
          cd "$dir"
          for f in "${files[@]}"; do
            gh release download "$TAG" --pattern "$f" --clobber || { echo "missing $f" >&2; exit 1; }
          done
          sha256sum "${files[@]}" > SHA256SUMS
          key="$RUNNER_TEMP/release-signing.pem"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          # the key Baguette trusts (RELEASE_KEY in app/src/update.rs): another one would make updates fail
          public=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          [ "$public" = 18d787177065e96304292b13b2ee55dcc840912731f0caad59bbb60ce3320b67 ] || { echo "RELEASE_SIGNING_KEY isn't the release key" >&2; exit 1; }
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          [ "$(wc -c < SHA256SUMS.sig)" -eq 64 ] || { echo "the signature isn't 64 bytes" >&2; exit 1; }
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.sig --clobber
      - name: publish once both archives are on it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in "Baguette-$version-windows.zip" "Baguette-$version-linux.tar.gz" SHA256SUMS SHA256SUMS.sig; do
            echo "$assets" | grep -qx "$f" || { echo "missing $f" >&2; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
