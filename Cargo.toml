[workspace]
resolver = "2"
members = ["core", "cli", "stub", "app"]

[workspace.package]
version = "0.0.0" # the real version comes from the build (BAGUETTE_VERSION)
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
