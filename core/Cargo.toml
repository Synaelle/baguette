[package]
name = "baguette-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The FTP engine and the transfer workers shared by Baguette.exe and baguette-cli.exe.

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"], optional = true }
russh-sftp = { version = "3.0.1", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
sha2 = { version = "0.11.1", optional = true }
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "time", "sync", "macros"], optional = true }
windows-sys.workspace = true

[dev-dependencies]
rcgen = "0.14.10"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }
windows-sys.workspace = true

[features]
# baguette-cli only speaks plain FTP to Cement: the window adds FTPS and SFTP
tls = ["dep:rustls", "dep:rustls-platform-verifier", "dep:sha2"]
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio", "dep:sha2"]

[[test]]
name = "protocols"
required-features = ["tls", "sftp"]

[[example]]
name = "test_servers"
required-features = ["tls", "sftp"]
