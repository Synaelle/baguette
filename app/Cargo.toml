[package]
name = "baguette"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Baguette.exe: the window (Tauri: Rust underneath, HTML/CSS for the looks).

[[bin]]
name = "Baguette"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
baguette-core = { path = "../core", features = ["tls", "sftp"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
# the signed checksums of updates (both already come with rustls and core)
ring = "0.17.14"
sha2 = "0.11.1"

# drag-out to Explorer (OLE) and the Windows-only bits, and the update's zip
[target.'cfg(windows)'.dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
windows-sys.workspace = true
windows-core = "0.62"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# drag-out to the file manager: the same GTK as Tauri's
[target.'cfg(target_os = "linux")'.dependencies]
tar = { version = "0.4", default-features = false }
flate2 = "1"
gtk = "0.18"
